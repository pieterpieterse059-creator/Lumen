:root{--lr-bg:#1e1e1e;--lr-panel:#262626;--lr-panel-header:#2d2d2d;--lr-border:#383838;--lr-text:#c2c2c2;--lr-text-dim:#888;--lr-accent:#e8a33d;--lr-stage:#111;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--lr-text);background:var(--lr-bg);user-select:none;-webkit-user-select:none;color-scheme:dark}
*{box-sizing:border-box}html{height:100%}
/* App shell: header / left panel / stage / right panel */
body{margin:0;display:grid;grid-template-rows:36px minmax(0,1fr);grid-template-columns:260px minmax(0,1fr) 280px;height:100vh;height:100dvh;overflow:hidden;background:var(--lr-bg);font-size:11px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
input{user-select:text;-webkit-user-select:text}
button,select{font:inherit;color:var(--lr-text);background:#2f2f2f;border:1px solid #3d3d3d;border-radius:3px;padding:3px 10px;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
button:hover,select:hover{background:#383838;color:#fff}button:disabled{opacity:.35;pointer-events:none}
button.on{background:var(--lr-accent);border-color:var(--lr-accent);color:#fff}
.pri{background:var(--lr-accent);border-color:var(--lr-accent);color:#fff;font-weight:600}.pri:hover{background:#f0b458}
.ico{font-size:15px;line-height:1;padding:2px 9px}
:focus-visible{outline:1px solid var(--lr-accent);outline-offset:1px}
/* Top bar */
header.lr-header{grid-column:1/-1;background:#181818;border-bottom:1px solid var(--lr-border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:10px}
.grp{display:flex;gap:4px;align-items:center}
.seg{display:flex;gap:1px}.seg button{border-radius:0}.seg button:first-child{border-radius:3px 0 0 3px}.seg button:last-child{border-radius:0 3px 3px 0}
.lr-modules{display:flex;gap:4px}
.lr-module-btn{background:transparent!important;border:none!important;color:var(--lr-text-dim);padding:6px 14px;font-weight:500;cursor:pointer;border-radius:3px}
.lr-module-btn:hover:not(:disabled){color:#fff}.lr-module-btn.active,.lr-module-btn.on{color:#fff;background:#333!important}
/* Side panels */
aside.lr-sidebar{background:var(--lr-panel);border-left:1px solid var(--lr-border);overflow-y:auto;display:flex;flex-direction:column;min-height:0}
aside.lr-sidebar.left{border-left:none;border-right:1px solid var(--lr-border)}
#hist{display:block;width:calc(100% - 24px);height:76px;margin:12px;flex:none;background:#191919;border:1px solid var(--lr-border)}
/* Accordion */
.lr-group{border-bottom:1px solid var(--lr-border);flex:none}
.lr-group-header{background:var(--lr-panel-header);padding:8px 12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#dedede;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.lr-group-header:hover{color:#fff}
.lr-arrow{font-size:8px;color:var(--lr-text-dim);transition:transform .15s;transform:rotate(90deg)}
.lr-group.closed .lr-arrow{transform:none}.lr-group.closed .lr-group-content{display:none}
.lr-group-content{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.lr-group-content>button{align-self:flex-start}
/* Slider rows: label | track | typed value */
.lr-control-row{display:grid;grid-template-columns:80px 1fr 36px;align-items:center;gap:8px}
.lr-control-row label{color:var(--lr-text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-control-row input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:16px;width:100%;margin:0}
.lr-control-row input[type=range]::-webkit-slider-runnable-track{height:3px;background:#444;border-radius:1px}
.lr-control-row input[type=range]::-moz-range-track{height:3px;background:#444;border-radius:1px}
.lr-control-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:9px;height:11px;background:#bbb;border-radius:2px;margin-top:-4px;cursor:ew-resize}
.lr-control-row input[type=range]::-moz-range-thumb{width:9px;height:11px;background:#bbb;border-radius:2px;border:0;cursor:ew-resize}
.lr-control-row input[type=range]::-webkit-slider-thumb:hover,.lr-control-row input[type=range]:active::-webkit-slider-thumb{background:#fff}
.lr-control-row input[type=range]:hover::-moz-range-thumb{background:#fff}
.lr-value-input{width:100%;background:#191919;border:1px solid var(--lr-border);color:var(--lr-text);text-align:right;padding:2px 4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;border-radius:2px;outline:0}
.lr-value-input:focus{border-color:var(--lr-accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chips button{padding:3px 9px}
.sel{display:flex;gap:8px;align-items:center;justify-content:space-between}
#cc{width:100%;aspect-ratio:1;background:#191919;border:1px solid var(--lr-border);touch-action:none;cursor:crosshair;display:block}
/* History list (left panel) */
#hlist{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.lr-hi{padding:4px 8px;color:var(--lr-text-dim);cursor:pointer;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-hi:hover{color:#fff;background:#333}.lr-hi.on{color:#fff;background:var(--lr-accent)}
/* Central stage */
main.lr-stage{background:linear-gradient(#161616,var(--lr-stage));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:32px;touch-action:none;min-width:0;min-height:0}
#cv{max-width:100%;max-height:100%;box-shadow:0 0 0 1px #000,0 8px 40px #000a;display:none}
#empty{text-align:center;color:var(--lr-text-dim);max-width:280px;line-height:1.6;font-size:12px}#empty b{display:block;color:var(--lr-text);font-size:15px;font-weight:600;margin-bottom:6px}
#stage.drag{outline:2px dashed var(--lr-accent);outline-offset:-10px}
#split{position:absolute;width:1px;background:#fff;box-shadow:0 0 6px #000;display:none;pointer-events:none}
#split::after{content:"";position:absolute;top:50%;left:50%;width:22px;height:22px;margin:-11px;border-radius:50%;background:var(--lr-accent);border:2px solid #fff}
.tag{position:absolute;bottom:8px;padding:1px 7px;border-radius:2px;background:#000a;font:10px ui-monospace,Menlo,Consolas,monospace;color:#bbb;pointer-events:none}
/* ===== Theme: matte charcoal + warm amber ===== */
:root{--bg:#1a1b1d;        /* Deep matte charcoal background */
  --panel:#232427;     /* Slightly lighter card/header panel surface */
  --line:#37393d;      /* Subtle border and divider lines */
  --text:#d8d9dc;      /* Primary high-legibility off-white text */
  --dim:#8b8d93;       /* Muted secondary labels and icons */
  --accent:#e8a33d;    /* Warm amber / active highlight accent */
  --stage:#0e0e0f;     /* Deep canvas / photo preview stage */
  /* map the theme onto the editor's own variables */
  --lr-bg:var(--bg);--lr-panel:var(--panel);--lr-panel-header:#2a2b2f;--lr-border:var(--line);--lr-text:var(--text);--lr-text-dim:var(--dim);--lr-accent:var(--accent);--lr-stage:var(--stage)}
*{box-sizing:border-box}
html,body{margin:0;background-color:var(--bg);color:var(--text);font:12px/1.35 "Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
/* Header / Top Navigation Bar */
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header.lr-header{background:var(--panel);border-bottom:1px solid var(--line)}
/* Minimalist Dark Buttons */
button,select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:6px 10px;font:inherit;cursor:pointer;transition:border-color .12s,background .12s}
button:hover,select:hover{background:#2c2d31;color:#fff;border-color:var(--accent)}
button.primary,button.on,button.pri{background:var(--accent);color:#1a1b1d;border-color:var(--accent);font-weight:600}
.pri:hover{background:#f0b255;color:#1a1b1d}
.lr-hi.on{color:#1a1b1d}
main.lr-stage{background:var(--stage)}
#hist,#cc,.lr-value-input{background:var(--stage)}
/* Bottom Navigation / Toolbars */
.bottom-nav{display:flex;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);padding:10px 0;color:var(--dim)}
/* Main Stage Area */
.stage{flex:1;background:var(--stage);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
/* Thumbnail Grid Card */
.gallery-card{width:140px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px;cursor:pointer}

/* ---------- tone curve (monotone cubic -> 256-entry LUT) ---------- */
function mkLUT(){
 const n=curve.length,x=curve.map(a=>a[0]),y=curve.map(a=>a[1]),m=[],t=[];
 for(let i=0;i<n-1;i++)m[i]=(y[i+1]-y[i])/(x[i+1]-x[i]||1e-6);
 t[0]=m[0];t[n-1]=m[n-2];for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;

 let j=0;cu=false;
 for(let v=0;v<256;v++){const u=v/255;while(j<n-2&&u>x[j+1])j++;const h=x[j+1]-x[j]||1e-6,s=(u-x[j])/h,s2=s*s,s3=s2*s;
  LUT[v]=cl(Math.round(((2*s3-3*s2+1)*y[j]+(s3-2*s2+s)*h*t[j]+(-2*s3+3*s2)*y[j+1]+(s3-s2)*h*t[j+1])*255),0,255);if(LUT[v]!==v)cu=true}}
const cc=$("#cc"),cx=cc.getContext("2d");let di=-1;
function drawCurve(){
 const W=cc.width;cx.clearRect(0,0,W,W);cx.lineWidth=1;cx.strokeStyle="#2e3035";
 for(let i=1;i<4;i++){cx.beginPath();cx.moveTo(i*W/4,0);cx.lineTo(i*W/4,W);cx.moveTo(0,i*W/4);cx.lineTo(W,i*W/4);cx.stroke()}
 cx.strokeStyle="#4a4d55";cx.beginPath();cx.moveTo(0,W);cx.lineTo(W,0);cx.stroke();
 cx.strokeStyle="#e6e6e6";cx.lineWidth=2;cx.beginPath();for(let v=0;v<256;v++){const px=v/255*W,py=W-LUT[v]/255*W;v?cx.lineTo(px,py):cx.moveTo(px,py)}cx.stroke();
 cx.fillStyle="#e8a33d";curve.forEach(a=>{cx.beginPath();cx.arc(a[0]*W,W-a[1]*W,5,0,7);cx.fill()})}
function curveChanged(){mkLUT();drawCurve();req()}
const cpos=e=>{const r=cc.getBoundingClientRect();return[cl((e.clientX-r.left)/r.width,0,1),cl(1-(e.clientY-r.top)/r.height,0,1)]};
cc.onpointerdown=e=>{const[x,y]=cpos(e);let i=curve.findIndex(a=>Math.hypot(a[0]-x,a[1]-y)<.07);
 if(i<0){curve.push([x,y]);curve.sort((a,b)=>a[0]-b[0]);i=curve.findIndex(a=>a[0]===x)}di=i;cc.setPointerCapture(e.pointerId);curveChanged()};
cc.onpointermove=e=>{if(di<0)return;const[x,y]=cpos(e),n=curve.length-1;
 curve[di]=[di===0?0:di===n?1:cl(x,curve[di-1][0]+.02,curve[di+1][0]-.02),y];curveChanged()};
cc.onpointerup=()=>{if(di>=0){di=-1;commit()}};
cc.ondblclick=e=>{const[x,y]=cpos(e),i=curve.findIndex(a=>Math.hypot(a[0]-x,a[1]-y)<.07);if(i>0&&i<curve.length-1){curve.splice(i,1);curveChanged();commit()}};

/* ---------- geometry: rotate / flip / straighten / crop -> canvas ---------- */

 const c=document.createElement("canvas");c.width=Math.max(1,Math.round(C.w*k));c.height=Math.max(1,Math.round(C.h*k));
 const x=c.getContext("2d");x.imageSmoothingQuality="high";x.scale(c.width/C.w,c.height/C.h);x.translate(-C.x,-C.y);
 x.translate(W/2,H/2);x.rotate(t);x.rotate(rot*Math.PI/2);x.scale(fx?-1:1,fy?-1:1);x.drawImage(src,-sw/2,-sh/2);return c}
function cropPx(){const [W,H]=vdim();return{x:crop.x*W,y:crop.y*H,w:crop.w*W,h:crop.h*H}}

/* ---------- pixel pipeline ---------- */
function proc(d,w,h,b1,b2){
 const e=2**S.exposure,ct=1+S.contrast/100,hi=S.highlights/100,sh=S.shadows/100,t=S.temp/100,ti=S.tint/100,vb=S.vibrance/100,sa=1+S.saturation/100,
  sp=S.sharpen/40,cn=S.clarity/60,vg=S.vignette/100*.9,gr=S.grain*.5,mx0=w/2,my0=h/2,md=Math.hypot(mx0,my0);
 for(let i=0,p=0;i<d.length;i+=4,p++){
  const o0=d[i],o1=d[i+1],o2=d[i+2];
  let r=o0*e*(1+t*.25),g=o1*e*(1-ti*.2),b=o2*e*(1-t*.25);                 // exposure, white balance
  const n=cl((.2126*r+.7152*g+.0722*b)/255,0,1),dl=(sh*(1-n)*(1-n)+hi*n*n)*70;r+=dl;g+=dl;b+=dl; // shadows / highlights
  r=(r-128)*ct+128;g=(g-128)*ct+128;b=(b-128)*ct+128;                      // contrast
  if(b2){r+=(o0-b2[i])*cn;g+=(o1-b2[i+1])*cn;b+=(o2-b2[i+2])*cn}          // clarity (large-radius local contrast)
  if(b1){r+=(o0-b1[i])*sp;g+=(o1-b1[i+1])*sp;b+=(o2-b1[i+2])*sp}          // unsharp mask
  if(sa!==1||vb){const l=.2126*r+.7152*g+.0722*b,s=(Math.max(r,g,b)-Math.min(r,g,b))/(Math.max(r,g,b)+1),k=sa*(1+vb*(1-s));r=l+(r-l)*k;g=l+(g-l)*k;b=l+(b-l)*k}
  r=r<0?0:r>255?255:r;g=g<0?0:g>255?255:g;b=b<0?0:b>255?255:b;
  if(cu){r=LUT[r|0];g=LUT[g|0];b=LUT[b|0]}                                 // tone curve
  if(vg){const dd=Math.hypot(p%w-mx0,((p/w)|0)-my0)/md,m=1+vg*dd*dd;r*=m;g*=m;b*=m}
  if(gr){const z=(Math.random()-.5)*gr;r+=z;g+=z;b+=z}
  d[i]=r;d[i+1]=g;d[i+2]=b}}
function run(c,fdata,cch){
 const w=c.width,h=c.height,sc=Math.max(w,h)/1400;
 const blur=(key,r)=>{if(!FS)return null;if(cch&&cch[key])return cch[key];
  const t=document.createElement("canvas");t.width=w;t.height=h;const x=t.getContext("2d");x.filter=`blur(${r}px)`;x.drawImage(c,0,0);
  const dd=x.getImageData(0,0,w,h).data;if(cch)cch[key]=dd;return dd};

/* ---------- render ---------- */
const req=()=>{if(!raf&&src)raf=requestAnimationFrame(render)};
function render(){
 raf=0;if(!src)return;
 if(S.angle!==la){la=S.angle;fitValid();if(cropMode)vNeed=1}
 const key=JSON.stringify([rot,fx,fy,S.angle,cropMode,cropMode?0:crop]);
 if(key!==gk){gk=key;fc=frame(1400,cropMode);fd=fc.getContext("2d").getImageData(0,0,fc.width,fc.height);cache={}} // geometry cache
 const w=fc.width,h=fc.height,ed=run(fc,fd,cache);
 const md=cropMode?0:mode,hd=cropMode?false:hold;cv.width=md===2?w*2:w;cv.height=h;
 if(hd)ctx.putImageData(fd,0,0);
 else if(md===0)ctx.putImageData(ed,0,0);
 else if(md===1){ctx.putImageData(ed,0,0);ctx.putImageData(fd,0,0,0,0,Math.round(w*split),h)}
 else{ctx.putImageData(fd,0,0);ctx.putImageData(ed,w,0)}
 drawHist(ed.data);if(cropMode&&vNeed){const a=vNeed===2;vNeed=0;layoutView(a)}else place();
 $("#info").textContent=`${fc.width===Math.round(fc.width)?Math.round(frameSize()[0]):0} × ${Math.round(frameSize()[1])} px`}
function frameSize(){const C=cropPx();return[C.w,C.h]}
function place(){updateCrop(); // position the split handle over the canvas
 const sp=$("#split"),on=mode===1&&!hold&&!cropMode;sp.style.display=on?"block":"none";if(!on)return;
 const r=cv.getBoundingClientRect(),s=$("#stage").getBoundingClientRect();
 sp.style.left=r.left-s.left+r.width*split-1+"px";sp.style.top=r.top-s.top+"px";sp.style.height=r.height+"px"}
function drawHist(d){
 const c=$("#hist"),x=c.getContext("2d"),W=c.width,H=c.height,B=[0,1,2].map(()=>new Uint32Array(64));
 for(let i=0;i<d.length;i+=16){B[0][d[i]>>2]++;B[1][d[i+1]>>2]++;B[2][d[i+2]>>2]++}
 const mx=Math.max(...B.map(b=>Math.max(...b)))||1;x.clearRect(0,0,W,H);x.globalCompositeOperation="lighter";

/* ---------- history ---------- */
const snap=()=>JSON.stringify({S,curve,rot,fx,fy,ar,crop});
function describe(a,b){const x=JSON.parse(a),y=JSON.parse(b),ch=Object.keys(y.S).filter(k=>x.S[k]!==y.S[k]);

 if(JSON.stringify(x.curve)!==JSON.stringify(y.curve))return"Tone curve";if(x.rot!==y.rot||x.fx!==y.fx||x.fy!==y.fy)return"Rotate / Flip";if(JSON.stringify(x.crop)!==JSON.stringify(y.crop))return"Crop";if(x.ar!==y.ar)return"Crop aspect";
 if(x.rot!==y.rot||x.fx!==y.fx||x.fy!==y.fy)return"Rotate / Flip";return"Edit"}

/* ---------- loading ---------- */
function setImg(im){

 S={...DEF};curve=[[0,0],[1,1]];rot=fx=fy=ar=0;crop={x:0,y:0,w:1,h:1};la=0;cropMode=false;$("#stage").classList.remove("cropping");gk="";hist=[];labels=[];hi=-1;

function sample(){const im=new Image();im.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=1;const x=c.getContext("2d");x.drawImage(im,0,0);x.getImageData(0,0,1,1);setImg(im)}catch(e){procSample()}};im.onerror=procSample;im.src=SAMPLE_SRC}
function procSample(){ // procedural sunset landscape so the editor works with no upload
